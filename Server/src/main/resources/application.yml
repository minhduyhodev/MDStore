spring:
  threads:
    virtual:
      enabled: true   # ADR-002: Virtual Threads cho I/O-bound calls

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:mdstore}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:secret}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema, không để Hibernate tự tạo
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration

# VietShare supplier config — xem docs/04-suppliers/vietshare.md
vietshare:
  api-url: ${VIETSHARE_API_URL:https://token.vietshare.site/v1}
  api-key: ${VIETSHARE_API_KEY:}
  api-secret: ${VIETSHARE_API_SECRET:}
  connect-timeout-seconds: 5
  read-timeout-seconds: 10

logging:
  level:
    com.mdstore: DEBUG
    org.springframework.web.client: DEBUG
