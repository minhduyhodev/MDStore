spring:
  threads:
    virtual:
      enabled: true # ADR-002: Virtual Threads cho I/O-bound calls

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB:mdstore} # Bắt buộc — không có fallback cho host/port
    username: ${POSTGRES_USER} # Bắt buộc — không có fallback, Spring Boot báo lỗi nếu thiếu
    password: ${POSTGRES_PASSWORD} # Bắt buộc — không có fallback
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update # Hibernate cập nhật schema theo JPA entity; DDL chuẩn được ghi tại docs/03-db-schema.md
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# VietShare supplier config — xem docs/04-suppliers/vietshare.md
vietshare:
  api-url: ${VIETSHARE_API_URL} # Bắt buộc — không có fallback
  api-key: ${VIETSHARE_API_KEY} # Bắt buộc — không có fallback
  api-secret: ${VIETSHARE_API_SECRET} # Bắt buộc — không có fallback
  connect-timeout-seconds: 5
  read-timeout-seconds: 10

mdstore:
  orders:
    retry:
      enabled: true
      poll-delay: 1000
      batch-size: 50
      lease-duration: 60s
      retry-after-cap: 60s
      delays: [5s, 15s, 30s]

logging:
  level:
    com.mdstore: DEBUG
    org.springframework.web.client: DEBUG
